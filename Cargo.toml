[workspace]
members = ["crates/diggerchain-core", "crates/diggerchain-terminal", "crates/diggerchain-lab", "crates/diggerchain-web"]
exclude = ["experiments/proof-lab"]
default-members = ["crates/diggerchain-terminal"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
diggerchain-core = { path = "crates/diggerchain-core" }
crossterm = "0.29"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
getrandom = "0.2.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.web]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
strip = true
