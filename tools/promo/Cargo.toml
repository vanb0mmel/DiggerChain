[package]
name = "diggerchain-promo"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "diggerchain-promo"

[dependencies]
fframes = { version = "=1.3.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.3.0", features = ["vulkan"] }
fframes_native_player = { version = "=1.3.0", default-features = false, features = ["vulkan", "audio"] }
serde_json = "1"
vt100 = "0.16"
diggerchain-core = { path = "../../crates/diggerchain-core" }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.3.0", features = ["libav-agree-gpl", "h264"] }

[lib]
name = "diggerchain_promo"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "diggerchain-promo"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
