name: Optional checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RAYON_NUM_THREADS: 2
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Check proof formatting
        run: cargo fmt --manifest-path experiments/proof-lab/Cargo.toml -- --check
      - name: Test proof constraints and fixed-parameter boundaries
        run: cargo test --manifest-path experiments/proof-lab/Cargo.toml --release --locked -j 2 -- --test-threads=1
      - name: Lint proof tool
        run: cargo clippy --manifest-path experiments/proof-lab/Cargo.toml --all-targets --release --locked -- -D warnings
      - name: Check public-artifact packaging and wallet boundaries
        run: python -m unittest discover -s scripts -p "test_*.py" -v
