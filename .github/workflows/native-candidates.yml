name: Alpha builds

on:
  workflow_dispatch:
  push:
    tags: ["v*-alpha.*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: macos-15
            label: macos-arm64
            target: aarch64-apple-darwin
            extension: ""
          - os: macos-15
            label: macos-x86_64
            target: x86_64-apple-darwin
            extension: ""
    runs-on: ${{ matrix.os }}
    env:
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Fetch target metadata for license notices
        run: cargo fetch --locked --target ${{ matrix.target }}
      - name: Build terminal game
        run: cargo build --release --locked -j 2 -p diggerchain-terminal --target ${{ matrix.target }}
      - name: Package explicit binaries
        run: python scripts/package_release.py --game target/${{ matrix.target }}/release/diggerchain${{ matrix.extension }} --label diggerchain-0.1.0-alpha.1-${{ matrix.label }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: diggerchain-0.1.0-alpha.1-${{ matrix.label }}
          path: target/dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: diggerchain-0.1.0-alpha.1-*
          merge-multiple: true
          path: artifacts
      - name: Publish the alpha prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 --prerelease --title "DiggerChain 0.1.0-alpha.1" --notes-file docs/RELEASE_NOTES_ALPHA.md
