[package]
name = "diggerchain-proof-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
default-run = "diggerchain-proof-lab"

[[bin]]
name = "diggerchain-proof"
path = "src/release.rs"

[workspace]

[dependencies]
ark-bn254 = "=0.5.0"
ark-ff = "0.5"
ark-groth16 = "=0.5.0"
ark-crypto-primitives = { version = "=0.5.0", features = ["crh", "r1cs"] }
ark-r1cs-std = "=0.5.0"
ark-relations = "0.5"
ark-serialize = "0.5"
diggerchain-core = { path = "../../crates/diggerchain-core" }
rand = "0.8"
serde_json = "1"
sha2 = "0.10.9"
rayon = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"

[profile.test]
opt-level = 2
